# Codemagic cloud build: this fork of NuvioTV, signed with our own team and sent to TestFlight.
# Nothing secret lives in this file. One-time setup is in CODEMAGIC.md.
workflows:
  nuviotv-testflight:
    name: NuvioTV to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Chorus            # the team's existing App Store Connect API integration (same Apple account)
    environment:
      groups:
        - nuviotv                          # CERTIFICATE_PRIVATE_KEY (required); TMDB_API_KEY etc. (optional)
      vars:
        APP_BUNDLE_ID: com.adamle.nuviotv
        APPLE_TEAM_ID: 797U56LQ33
      java: 17
      xcode: 27.0                          # AetherEngine requires Xcode 27 (Swift 6.4); Xcode 26 is best-effort upstream
    scripts:
      - name: Signing files (cheap; runs before the long compile)
        script: |
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then echo "CERTIFICATE_PRIVATE_KEY is not set: stopping so a new orphan certificate is not created" >&2; exit 1; fi
          printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key && chmod 600 /tmp/cert_key
          # Guard: reuse the team's existing distribution certificate. If none matches this key, stop
          # rather than let --create below mint a new certificate.
          MATCH=$(app-store-connect list-certificates --type DISTRIBUTION --certificate-key @file:/tmp/cert_key --json 2>/dev/null || echo '[]')
          [ "$(printf '%s' "$MATCH" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" -gt 0 ] || \
            MATCH=$(app-store-connect list-certificates --type IOS_DISTRIBUTION --certificate-key @file:/tmp/cert_key --json 2>/dev/null || echo '[]')
          if [ "$(printf '%s' "$MATCH" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" -eq 0 ]; then
            echo "No existing distribution certificate matches CERTIFICATE_PRIVATE_KEY: stopping (would create a new one)." >&2; exit 1
          fi
          # --create registers the bundle ids and profiles on the first run.
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" --strict-match-identifier --type TVOS_APP_STORE --create --certificate-key @file:/tmp/cert_key
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID.topshelf" --strict-match-identifier --type TVOS_APP_STORE --create --certificate-key @file:/tmp/cert_key
          keychain initialize
          app-store-connect list-certificates --type DISTRIBUTION --certificate-key @file:/tmp/cert_key --save || \
            app-store-connect list-certificates --type IOS_DISTRIBUTION --certificate-key @file:/tmp/cert_key --save
          keychain add-certificates
      - name: Stop early if the App Store Connect app record is missing
        script: |
          APPS=$(app-store-connect apps list --bundle-id-identifier "$APP_BUNDLE_ID" --strict-match-identifier --json 2>/dev/null || echo '[]')
          APP_ADC_ID=$(printf '%s' "$APPS" | python3 -c 'import json,sys; a=json.load(sys.stdin); print(a[0]["id"] if a else "")')
          if [ -z "$APP_ADC_ID" ]; then
            echo "NO APP RECORD: create a tvOS app in App Store Connect with bundle id $APP_BUNDLE_ID, then run again." >&2
            echo "The bundle ids are now registered, so they appear in the New App dropdown." >&2
            exit 1
          fi
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ADC_ID" --platform TV_OS 2>/dev/null | tail -1 | tr -dc '0-9')
          NEXT=$(( ${LATEST:-153} + 1 )); [ "$NEXT" -lt 154 ] && NEXT=154
          echo "NEXT_BUILD_NUMBER=$NEXT" >> "$CM_ENV"
          echo "App record $APP_ADC_ID found; build number $NEXT"
      - name: Submodules, toolchain and QuickJS for tvOS
        script: |
          # Not --recursive from the top: NuvioMobile carries a stale gitlink (libass-android) with no
          # .gitmodules url, which aborts a full recursive update. Fetch only what the tvOS build needs.
          git submodule update --init NuvioMobile
          git -C NuvioMobile submodule update --init --recursive MPVKit
          test -f NuvioMobile/MPVKit/Package.swift || { echo "MPVKit submodule missing" >&2; exit 1; }
          command -v cmake >/dev/null || brew install cmake
          java -version 2>&1 | head -1
          # quickjs-kt expects Xcode output in <cfg>-<sdk>/ (e.g. Debug-appletvos/). The CMake on these Macs
          # writes plain <cfg>/ instead, so the copy step failed (build 6b08785c). Apply the tvOS patch here,
          # then make the copy fall back to <cfg>/. The scaffolding script sees a patched tree and only builds.
          QJS="$HOME/quickjs-kt-tvos"
          git clone --branch v1.0.5 --depth 1 https://github.com/dokar3/quickjs-kt "$QJS"
          git -C "$QJS" submodule update --init --depth 1
          git -C "$QJS" apply "$PWD/scaffolding/quickjs-kt-tvos.patch"
          F="$QJS/buildSrc/src/main/kotlin/com/dokar/quickjs/buildQuickJsNativeLibrary.kt"
          OLD='val libraryFile = file("native/build/$platform/${dir}libquickjs.$ext")'
          NEW='val libraryFile = file("native/build/$platform/${dir}libquickjs.$ext").let { f -> if (f.exists()) f else file("native/build/$platform/$buildType/libquickjs.$ext") }'
          grep -qF "$OLD" "$F" || { echo "quickjs copy line not found; patch layout changed" >&2; exit 1; }
          python3 - "$F" "$OLD" "$NEW" <<'PY'
          import sys
          p, old, new = sys.argv[1:4]
          s = open(p).read(); open(p, "w").write(s.replace(old, new, 1))
          PY
          # CMake 4.x (Homebrew here) also defaults CMAKE_OSX_SYSROOT to the macOS SDK for tvOS targets
          # ("MacOSX26.5.sdk is not an tvOS SDK", build 6b0879e9). Name the tvOS SDKs explicitly, and build
          # with CMake 3.31 like the upstream Mac.
          CML="$QJS/quickjs/native/CMakeLists.txt"
          python3 - "$CML" <<'PY'
          import sys, re
          p = sys.argv[1]; s = open(p).read()
          for plat, sdk in (("tvos_aarch64", "appletvos"), ("tvos_simulator_aarch64", "appletvsimulator")):
              head = 'elseif (TARGET_PLATFORM STREQUAL "%s")\n    set(CMAKE_SYSTEM_NAME "tvOS")\n' % plat
              assert head in s, "tvOS block not found for " + plat
              s = s.replace(head, head + '    set(CMAKE_OSX_SYSROOT "%s")\n' % sdk, 1)
          open(p, "w").write(s)
          PY
          python3 -m venv "$HOME/cmake331" && "$HOME/cmake331/bin/pip" install --quiet "cmake==3.31.6"
          export CMAKE_PATH="$HOME/cmake331/bin/cmake"
          "$CMAKE_PATH" --version | head -1
          bash scaffolding/build-quickjs-tvos.sh "$QJS"
      - name: Point the project at our bundle ids
        script: bash scripts/codemagic/prepare.sh
      - name: Apply signing
        script: xcode-project use-profiles --project NuvioMobile/iosApp/iosApp.xcodeproj
      - name: Build the tvOS app
        script: |
          cd NuvioMobile
          # Swift packages go to a folder we own, get patched (scripts/codemagic/patch-packages.py), then
          # the archive uses exactly those checkouts.
          SPM="$HOME/spm-nuviotv"
          xcodebuild -resolvePackageDependencies -project iosApp/iosApp.xcodeproj -scheme NuvioTV -clonedSourcePackagesDirPath "$SPM"
          python3 ../scripts/codemagic/patch-packages.py "$SPM"
          xcode-project build-ipa --project iosApp/iosApp.xcodeproj --scheme NuvioTV \
            --archive-flags="-clonedSourcePackagesDirPath $SPM -disableAutomaticPackageResolution"
    artifacts:
      - NuvioMobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
      email:
        recipients:
          - gvbgolfer@gmail.com
        notify:
          success: false
          failure: true
